- name: Ensure the user-local binary directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: Install uv
  become: true
  become_user: "{{ username }}"
  ansible.builtin.shell: |
    set -o pipefail
    curl --fail --silent --show-error --location \
      "https://astral.sh/uv/{{ uv_version }}/install.sh" | \
      env UV_INSTALL_DIR="{{ user_home }}/.local/bin" UV_NO_MODIFY_PATH=1 sh
  args:
    executable: /bin/bash
    creates: "{{ user_home }}/.local/bin/uv"

- name: Install Python command-line applications with uv
  become: true
  become_user: "{{ username }}"
  ansible.builtin.command:
    argv:
      - "{{ user_home }}/.local/bin/uv"
      - tool
      - install
      - "{{ item }}"
  loop:
    - awscli
    - aws-sam-cli
    - flake8
    - pre-commit
    - pycodestyle
    - ruff
    - virtualenv
    - yq
  register: uv_tool_install
  changed_when: "'Installed' in uv_tool_install.stderr"
